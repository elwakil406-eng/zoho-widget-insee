<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche INSEE</title>
    <script src="https://static.zohocdn.com/crm/jsapi/2.0/ZSDK.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fb; }
        .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .result-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; cursor: pointer; background: white; border-radius: 8px; }
        .result-card:hover { border-color: #007bff; }
    </style>
</head>
<body>
    <div class="search-row">
        <input type="text" id="searchInput" placeholder="Nom de l'entreprise...">
        <button class="btn" onclick="searchCompany()">Rechercher</button>
    </div>
    <div id="resultsContainer"></div>

    <script>
        let currentResults = [];
        ZOHO.embeddedApp.init();

        async function searchCompany() {
            let query = document.getElementById('searchInput').value;
            let res = await fetch("https://recherche-entreprises.api.gouv.fr/search?q=" + encodeURIComponent(query));
            let data = await res.json();
            currentResults = data.results;
            
            let html = "";
            currentResults.forEach((c, i) => {
                html += `<div class="result-card" onclick="validateSelection(${i})">
                            <strong>${c.nom_complet}</strong><br>
                            SIRET: ${c.siege.siret}
                         </div>`;
            });
            document.getElementById('resultsContainer').innerHTML = html;
        }

        async function validateSelection(index) {
            let c = currentResults[index];
            let siege = c.siege || {};
            
            // Les données envoyées au formulaire parent
            let dataToSend = {
                "Account_Name": c.nom_complet || "",
                "Adresse": siege.adresse || "",
                "Code_Postale": siege.code_postal ? String(siege.code_postal) : "",
                "Ville": siege.libelle_commune || "",
                "Siret": siege.siret ? String(siege.siret) : "",
                "Forme_juridique": c.nature_juridique || "",
                "NUMERO_DE_TVA": (c.siren ? "FR" + ((12 + 3 * (parseInt(c.siren) % 97)) % 97) + c.siren : "")
            };

            // Envoi vers Zoho via le pont de communication
            window.parent.postMessage({ type: "INSEE_DATA", data: dataToSend }, "*");
            ZOHO.CRM.UI.Popup.close();
        }
    </script>
</body>
</html>
