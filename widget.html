<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche INSEE</title>
    <script src="https://static.zohocdn.com/crm/jsapi/2.0/ZSDK.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .result-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; cursor: pointer; }
        .result-card:hover { background: #f0f0f0; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <input type="text" id="searchInput" placeholder="Raison sociale...">
    <button class="btn" onclick="searchCompany()">Rechercher</button>
    <div id="resultsContainer"></div>

    <script>
        let currentResults = [];

        ZOHO.embeddedApp.init();

        async function searchCompany() {
            var query = document.getElementById('searchInput').value;
            var response = await fetch("https://recherche-entreprises.api.gouv.fr/search?q=" + encodeURIComponent(query));
            var data = await response.json();
            currentResults = data.results;
            
            let html = "";
            currentResults.forEach((c, i) => {
                html += `<div class="result-card" onclick="validateSelection(${i})">
                            <strong>${c.nom_complet}</strong><br>
                            SIRET: ${c.siege.siret}
                         </div>`;
            });
            document.getElementById('resultsContainer').innerHTML = html;
        }

        async function validateSelection(index) {
            let c = currentResults[index];
            let siege = c.siege || {};
            
            // On prépare les données exactement comme Zoho les attend
            let recordData = {
                "Account_Name": c.nom_complet || "",
                "Adresse": siege.adresse || "",
                "Code_Postale": siege.code_postal ? String(siege.code_postal) : "",
                "Ville": siege.libelle_commune || "",
                "Siret": siege.siret || ""
            };

            // LA MÉTHODE QUI PASSE PARTOUT :
            ZOHO.CRM.API.insertRecord({
                Entity: "Enseignes",
                APIData: recordData,
                Trigger: ["workflow"]
            }).then(function(data){
                ZOHO.CRM.UI.Popup.close();
            }).catch(function(err){
                alert("Erreur critique : " + JSON.stringify(err));
            });
        }
    </script>
</body>
</html>
